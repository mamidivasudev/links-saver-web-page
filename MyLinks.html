      body.dark-mode .category li a:hover { color: var(--cat-d, #3794ff); }
    </style>
  </head>
  <body>
    <script>try { if (localStorage.getItem('links_dark') === '1') document.body.classList.add('dark-mode'); } catch (e) { }</script>
    <header class="header-container">
      <div class="top-bar">
        <div class="logo-section">
          <h2><i data-lucide="pin"></i> My Favorite Links</h2>
        </div>
        
        <div class="header-actions-wrapper">
          <div class="nav-links">
            <a href="save-expenses.html" target="_blank" class="nav-btn"><i data-lucide="wallet" size="14"></i> Save Expenses</a>
            <a href="save-notes.html" target="_blank" class="nav-btn"><i data-lucide="sticky-note" size="14"></i> Save Notes</a>
          </div>

          <div style="width: 1px; height: 30px; background: var(--border-light); margin: 0 5px;"></div>

          <div class="action-group">
            <div class="action-item">
              <button class="btn-icon" onclick="exportToJSON()" title="Export links (JSON)"><i data-lucide="download" size="14"></i></button>
              <span>Export</span>
            </div>
            <div class="action-item">
              <button class="btn-icon" onclick="triggerImport()" title="Import links (JSON)"><i data-lucide="upload" size="14"></i></button>
              <span>Import</span>
            </div>
            <div class="action-item">
              <button class="btn-icon" onclick="openTrash()" title="Deleted links - restore them here"><i data-lucide="trash" size="14"></i></button>
              <span id="trashLabel">Trash</span>
            </div>
            <div class="action-item">
              <button class="btn-icon" onclick="undoDelete()" title="Undo last delete"><i data-lucide="undo-2" size="14"></i></button>
              <span>Undo</span>
            </div>
            <div class="action-item">
              <button id="folderBtn" class="btn-icon" title="Pick sync folder (e.g. D:\MY FOLDER\Sync_data)"><i data-lucide="folder-open" size="14"></i></button>
              <span>Folder</span>
            </div>
            <div class="action-item">
              <button id="syncBtn" class="btn-icon" title="Sync with saved_links.json"><i data-lucide="refresh-cw" size="14"></i></button>
              <span>Sync</span>
            </div>
            <div id="syncStatus" class="file-status">Connecting...</div>
          </div>
          
          <div style="width: 1px; height: 20px; background: var(--border-light); margin: 0 5px;"></div>
          
          <div class="theme-toggle" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">
            <div class="theme-ball" id="themeBall">🌙</div>
          </div>
        </div>
      </div>

      <div class="form-grid">
        <select id="category-select">
          <option value="">🔁 Select category</option>
        </select>
        <input type="text" id="category-name" placeholder="New Category Name" />
        <input type="text" id="link-name" placeholder="Link Title" />
        <input type="text" id="link-url" placeholder="URL (https://...)" />
        
        <button class="btn-primary" onclick="addNewLink()" style="padding: 8px 16px; font-size: 0.85rem;">
          <i data-lucide="plus-circle" size="16"></i> Save Link
        </button>
      </div>
    </header>

    <input type="file" id="importFile" style="display:none" onchange="importFromJSON()" />

    <div class="categories"></div>
    <div id="toast"></div>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('syncBtn').onclick = () => syncFromFile();
        document.getElementById('folderBtn').onclick = () => pickFolder();
        if (document.body.classList.contains('dark-mode')) { const b = document.getElementById('themeBall'); if (b) b.textContent = '☀️'; }
        loadLinks();
        initFileHandle(); // connect to saved_links.json (loads it if permission is still granted)
        refreshTrashLabel();
        setTimeout(() => { if (!linksHandle) showToast('⚠ No sync folder - click Folder to keep a backup file'); }, 3000);
        if (window.lucide) lucide.createIcons();

        // Handle category input locking
        const categorySelect = document.getElementById("category-select");
        const categoryNameInput = document.getElementById("category-name");
        
        categorySelect.addEventListener("change", function() {
          const val = this.value;
          if (val) {
            categoryNameInput.disabled = true;
            categoryNameInput.placeholder = "Category Already Selected";
            categoryNameInput.value = "";
            categoryNameInput.style.opacity = "0.6";
          } else {
            categoryNameInput.disabled = false;
            categoryNameInput.placeholder = "New Category Name";
            categoryNameInput.style.opacity = "1";
          }
          loadLinks(val);
        });

        // Close menus on click outside
        document.addEventListener('click', () => {
          document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('show'));
        });
      });

      let deletedBackup = null;
      let dragged = { category: null, index: null };
      let draggedCat = null;   // category card being dragged to a new position

      // ── Server API Sync (Replaces File System API) ──────────────
      
      // ── File sync: reads/writes saved_links.json in a folder you pick (no server needed) ──
      const LINKS_KEY = "customCategories";
      const DIRTY_KEY = "customCategories_unsynced"; // '1' = browser has changes not yet written to the file
      const _IDB = { name: 'myLinksFileDB', store: 'handles', key: 'linksHandle' };
      let linksHandle = null;
      let linksPerm = 'none'; // 'none' | 'granted' | 'prompt'
      let warnedNoPerm = false;
      // sharedMode: links live in the "links" key of My Notes' sync file (notes_data.json) - no folder picker needed
      let sharedMode = localStorage.getItem('links_mode') === 'notesfile';
      let fileSynced = false;      // true once this session has read the file and brought both sides in line
      let fileUnreadable = false;  // file exists but is not valid links JSON -> never overwrite it

      // union of two link sets (browser links first, then links that only exist in the file)
      function mergeLinks(fileData, local) {
        const out = {};
        const cats = Object.keys(local).concat(Object.keys(fileData).filter(k => !(k in local)));
        cats.forEach(c => {
          const seen = new Set();
          out[c] = [];
          (local[c] || []).concat(fileData[c] || []).forEach(l => {
            const k = ((l && l.name) || '') + '\n' + ((l && l.url) || '');
            if (!seen.has(k)) { seen.add(k); out[c].push(l); }
          });
        });
        return out;
      }

      function _openIDB() {
        return new Promise((res, rej) => {
          const r = indexedDB.open(_IDB.name, 1);
          r.onupgradeneeded = e => e.target.result.createObjectStore(_IDB.store);
          r.onsuccess = e => res(e.target.result);
          r.onerror = e => rej(e.target.error);
        });
      }
      async function _getHandle() {
        try { const db = await _openIDB(); return await new Promise(r => { const q = db.transaction(_IDB.store, 'readonly').objectStore(_IDB.store).get(_IDB.key); q.onsuccess = e => r(e.target.result || null); q.onerror = () => r(null); }); } catch { return null; }
      }
      async function _putHandle(h) {
        try { const db = await _openIDB(); await new Promise(r => { const tx = db.transaction(_IDB.store, 'readwrite'); tx.objectStore(_IDB.store).put(h, _IDB.key); tx.oncomplete = r; tx.onerror = r; }); } catch { }
      }

      function updateFileStatus() {
        const el = document.getElementById('syncStatus');
        if (!el) return;
        if (!linksHandle) {
          el.textContent = '📂 Pick folder'; el.style.color = '#d97706';
          el.title = 'Click the Folder button and choose D:\\MY FOLDER\\Sync_data';
        } else if (linksPerm === 'granted') {
          const folder = sharedMode ? localStorage.getItem('myNotes.syncFolderName') : localStorage.getItem('links_syncFolderName');
          el.textContent = '📄 ' + (folder ? folder + ' / ' : '') + linksHandle.name + (sharedMode ? ' (links)' : ''); el.style.color = '#10b981';
          el.title = 'Saving to ' + (folder ? folder + ' / ' : '') + linksHandle.name;
        } else {
          el.textContent = '⚠ Click 🔄 to reconnect'; el.style.color = '#d97706';
          el.title = 'Browser needs permission again to use ' + linksHandle.name;
        }
      }

      async function ensurePermission(h, ask) {
        try {
          let p = await h.queryPermission({ mode: 'readwrite' });
          if (p !== 'granted' && ask) p = await h.requestPermission({ mode: 'readwrite' });
          return p === 'granted';
        } catch (e) { return false; }
      }

      const countLinks = d => Object.values(d || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
      const isLinksData = d => d && typeof d === 'object' && !Array.isArray(d) && Object.values(d).every(v => Array.isArray(v));

      async function writeFile(h) {
        const local = JSON.parse(localStorage.getItem(LINKS_KEY) || '{}');
        let out = JSON.stringify(local, null, 2);
        if (sharedMode) {
          // the file also holds My Notes data: change only the "links" key, never anything else
          let o;
          try { o = JSON.parse(await (await h.getFile()).text()); } catch (e) { o = null; }
          if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('notes_data.json could not be read safely - left untouched');
          o.links = local;
          out = JSON.stringify(o, null, 2);
        }
        const w = await h.createWritable();
        await w.write(out);
        await w.close();
        localStorage.removeItem(DIRTY_KEY);
      }

      // Bring browser and file in line. askOnConflict: used when a folder is first picked.
      async function loadFromFile(h, askOnConflict = false, notify = false) {
        const txt = await (await h.getFile()).text();
        const local = JSON.parse(localStorage.getItem(LINKS_KEY) || '{}');
        if (!txt.trim()) { await writeFile(h); fileSynced = true; fileUnreadable = false; showToast('✓ ' + h.name + ' created'); return; }
        let fileData;
        try {
          const o = JSON.parse(txt);
          fileData = sharedMode ? ((o && typeof o === 'object' && !Array.isArray(o)) ? (o.links || {}) : null) : o;
        } catch (e) { fileData = null; }
        if (!isLinksData(fileData)) {
          fileUnreadable = true;
          showToast('⚠ ' + h.name + ' is not a valid links file - left untouched (browser links are kept)');
          return;
        }
        fileUnreadable = false;
        if (JSON.stringify(fileData) === JSON.stringify(local)) {
          localStorage.removeItem(DIRTY_KEY); fileSynced = true;
          if (notify) showToast('✓ Already in sync (' + countLinks(local) + ' links)');
          return;
        }

        const bothHaveData = Object.keys(fileData).length > 0 && Object.keys(local).length > 0;
        // First sync of this session and both sides have links: merge, never replace one with the other
        if (bothHaveData && !askOnConflict && !fileSynced) {
          const merged = mergeLinks(fileData, local);
          localStorage.setItem(LINKS_KEY, JSON.stringify(merged));
          await writeFile(h);
          fileSynced = true;
          loadLinks(document.getElementById("category-select").value || null);
          showToast('✓ Merged browser and file links (' + countLinks(merged) + ' links)');
          return;
        }

        let useLocal = Object.keys(fileData).length === 0 && Object.keys(local).length > 0;
        if (!useLocal && Object.keys(local).length > 0) {
          if (askOnConflict) {
            const choice = confirm(`Browser and file have different links.\n\nOK = MERGE both (keeps everything: ${countLinks(fileData)} in file + ${countLinks(local)} in browser)\nCancel = keep browser links only and overwrite the file`);
            if (choice) {
              const merged = mergeLinks(fileData, local);
              localStorage.setItem(LINKS_KEY, JSON.stringify(merged));
              await writeFile(h);
              fileSynced = true;
              loadLinks(document.getElementById("category-select").value || null);
              showToast('✓ Merged (' + countLinks(merged) + ' links)');
              return;
            }
            useLocal = true;
          } else {
            useLocal = localStorage.getItem(DIRTY_KEY) === '1'; // browser has newer unsaved changes
          }
        }
        if (useLocal) { await writeFile(h); showToast('✓ Saved browser links to ' + h.name); }
        else {
          localStorage.setItem(LINKS_KEY, JSON.stringify(fileData));
          localStorage.removeItem(DIRTY_KEY);
          loadLinks(document.getElementById("category-select").value || null);
          showToast('✓ Loaded ' + countLinks(fileData) + ' links from ' + h.name);
        }
        fileSynced = true;
      }

      // Handles saved by My Notes (same browser storage): its folder, and a file inside it.
      // Used to open the SAME Sync_data folder without wandering through Windows folders.
      async function getNotesHandles() {
        const out = { dir: null, file: null };
        try {
          if (!indexedDB.databases) return out;
          const dbs = await indexedDB.databases();
          if (!dbs.some(d => d.name === 'myNotesFileDB')) return out;   // never create the DB from here
          const db = await new Promise((res, rej) => { const r = indexedDB.open('myNotesFileDB', 1); r.onsuccess = e => res(e.target.result); r.onerror = () => rej(r.error); });
          if (!db.objectStoreNames.contains('handles')) { db.close(); return out; }
          const get = key => new Promise(res => { const q = db.transaction('handles', 'readonly').objectStore('handles').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
          out.dir = await get('syncDirHandle');
          out.file = await get('notesHandle');
          db.close();
        } catch (e) { }
        return out;
      }

      // Read at page load, so the click handler below can open the picker IMMEDIATELY
      // (browsers only allow the picker right after a click, like My Notes does it).
      let notesHandlesCache = { dir: null, file: null };
      getNotesHandles().then(h => { notesHandlesCache = h; });

      async function pickFolder() {
        if (!window.showDirectoryPicker) { alert('Folder sync needs Chrome or Edge.'); return; }
        let step = 'start';
        try {
          let dir = null;
          // 1) reuse the folder My Notes already saved (no picker at all)
          if (notesHandlesCache.dir) {
            step = 'reusing My Notes folder';
            try { if (await notesHandlesCache.dir.requestPermission({ mode: 'readwrite' }) === 'granted') dir = notesHandlesCache.dir; } catch (e) { dir = null; }
          }
          // 1b) No saved folder from My Notes: offer to keep the links inside My Notes' own sync file
          if (!dir && notesHandlesCache.file) {
            step = 'connecting to the My Notes sync file';
            const useShared = confirm('Connect My Links to your sync file without the Windows folder picker?\n\n'
              + 'OK = store My Links inside My Notes\' sync file (' + notesHandlesCache.file.name + ', in your Sync_data folder). My Notes data is not touched.\n'
              + 'Cancel = try the folder picker instead.');
            if (useShared) {
              sharedMode = true;
              localStorage.setItem('links_mode', 'notesfile');
              const h = notesHandlesCache.file;
              if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') { sharedMode = false; localStorage.removeItem('links_mode'); alert('Permission was not granted for ' + h.name); return; }
              linksHandle = h; linksPerm = 'granted'; warnedNoPerm = false; fileSynced = false;
              step = 'reading the sync file';
              updateFileStatus();
              await loadFromFile(h, true);
              showToast('✓ My Links is now saved inside ' + h.name);
              return;
            }
          }
          // 2) otherwise exactly the picker call My Notes makes, with no awaits before it
          if (!dir) {
            step = 'folder picker';
            dir = await window.showDirectoryPicker({ id: 'myNotesSync', mode: 'readwrite' });
          }
          step = 'asking permission for ' + dir.name;
          if (await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') { alert('Permission was not granted for the folder "' + dir.name + '".'); return; }
          localStorage.setItem('links_syncFolderName', dir.name);
          step = 'creating/opening saved_links.json in ' + dir.name;
          const h = await dir.getFileHandle('saved_links.json', { create: true });
          linksHandle = h; linksPerm = 'granted'; warnedNoPerm = false;
          step = 'remembering the folder';
          await _putHandle(h);
          updateFileStatus();
          step = 'reading saved_links.json';
          await loadFromFile(h, true);
          showToast('✓ Connected to ' + dir.name + ' / saved_links.json');
        } catch (e) {
          console.error(e);
          updateFileStatus();
          if (e.name === 'AbortError') { alert('The folder picker closed without a folder (step: ' + step + '). It was cancelled, or the browser/Windows refused it. Try once more; if it repeats, tell me.'); return; }
          alert('Folder sync stopped at: ' + step + '\n\n' + (e.name || 'Error') + ': ' + (e.message || e));
        }
      }

      async function syncFromFile() {
        if (!linksHandle) return pickFolder();
        if (!(await ensurePermission(linksHandle, true))) { linksPerm = 'prompt'; updateFileStatus(); showToast('Permission denied'); return; }
        linksPerm = 'granted'; warnedNoPerm = false; updateFileStatus();
        try { showToast('Syncing…'); await loadFromFile(linksHandle, false, true); }
        catch (e) { console.error(e); showToast('⚠ Sync failed — is the file valid JSON?'); }
      }

      async function initFileHandle() {
        const h = sharedMode ? (await getNotesHandles()).file : await _getHandle();
        linksHandle = h;
        if (!h) { updateFileStatus(); return; }
        if (await ensurePermission(h, false)) {
          linksPerm = 'granted'; updateFileStatus();
          try { await loadFromFile(h); } catch (e) { console.warn('Load failed', e); }
        } else {
          // Browser forgot permission (normal after restart) — it can only be asked on a click
          linksPerm = 'prompt'; updateFileStatus();
          showToast('Click anywhere to load links from ' + h.name);
          const once = () => { document.removeEventListener('pointerdown', once, true); if (linksPerm !== 'granted') syncFromFile(); };
          document.addEventListener('pointerdown', once, true);
        }
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      // Called after every change: write the browser's links to saved_links.json
      // downloads a dated copy of the links (once a day automatically, and before an import)
      function downloadLinksBackup(tag) {
        try {
          const data = localStorage.getItem(LINKS_KEY);
          if (!data || data === '{}') return;
          const day = new Date().toISOString().slice(0, 10);
          const blob = new Blob([data], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'my_links_backup_' + day + (tag ? '_' + tag : '') + '.json';
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) { console.warn('backup failed', e); }
      }
      function maybeDailyLinksBackup() {
        try {
          const day = new Date().toISOString().slice(0, 10);
          if (localStorage.getItem('links_lastBackupDay') === day) return;
          localStorage.setItem('links_lastBackupDay', day);
          downloadLinksBackup('auto');
        } catch (e) { }
      }

      async function syncLinksToFile() {
        localStorage.setItem(DIRTY_KEY, '1'); // cleared once the file is written
        maybeDailyLinksBackup();
        if (!linksHandle) {
          updateFileStatus();
          if (!warnedNoPerm) { warnedNoPerm = true; showToast("⚠ Saved in browser only — click Folder to pick Sync_data"); }
          return false;
        }
        if (!(await ensurePermission(linksHandle, true))) {
          linksPerm = 'prompt'; updateFileStatus();
          if (!warnedNoPerm) { warnedNoPerm = true; showToast("⚠ Saved in browser only — click 🔄 to reconnect"); }
          return false;
        }
        try {
          if (!fileSynced) {
            // this session has not read the file yet: read/merge first so a fresh browser can never wipe it
            await loadFromFile(linksHandle, false);
          }
          if (fileUnreadable || !fileSynced) {
            showToast("⚠ File not overwritten (could not read it safely) - links are kept in the browser");
            return false;
          }
          await writeFile(linksHandle);
          linksPerm = 'granted'; warnedNoPerm = false; updateFileStatus();
          showToast("✓ Saved to " + linksHandle.name);
          return true;
        } catch (e) {
          console.warn('Save to file failed', e);
          showToast("⚠ Could not write " + linksHandle.name);
          return false;
        }
      }
      // ─────────────────────────────────────────────────────────────────

      // ── Trash: deleted links / categories can be restored (like My Notes) ──
      const TRASH_KEY = 'links_trash';
      let trash = [];
      try { trash = JSON.parse(localStorage.getItem(TRASH_KEY)) || []; } catch (e) { trash = []; }
      const saveTrash = () => { try { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); } catch (e) { } };
      function refreshTrashLabel() {
        const el = document.getElementById('trashLabel');
        if (el) el.textContent = trash.length ? 'Trash (' + trash.length + ')' : 'Trash';
        const item = el && el.closest('.action-item');
        if (item) { item.dataset.count = trash.length; const b = item.querySelector('button'); if (b) b.title = (trash.length ? 'Trash (' + trash.length + ') - restore deleted links' : 'Trash is empty'); }
      }
      function trashLinks(category, links) {
        const now = new Date().toISOString();
        (links || []).forEach(l => trash.push({ category, link: l, deletedAt: now }));
        if (trash.length > 100) trash = trash.slice(trash.length - 100);
        saveTrash(); refreshTrashLabel();
      }
      function restoreFromTrash(i) {
        const e = trash[i];
        if (!e) return;
        const all = JSON.parse(localStorage.getItem(LINKS_KEY) || '{}');
        if (!all[e.category]) all[e.category] = [];
        all[e.category].push(e.link);
        localStorage.setItem(LINKS_KEY, JSON.stringify(all));
        localStorage.setItem('backup_customCategories', JSON.stringify(all));
        trash.splice(i, 1);
        saveTrash(); refreshTrashLabel();
        loadLinks(document.getElementById("category-select").value || null);
        syncLinksToFile();
        showToast('✓ Restored to ' + e.category);
      }
      function closeLinksModal() { const o = document.getElementById('nmOverlay'); if (o) o.remove(); }
      function openTrash() {
        closeLinksModal();
        const ov = document.createElement('div');
        ov.id = 'nmOverlay'; ov.className = 'nm-overlay';
        const box = document.createElement('div'); box.className = 'nm-box';
        const head = document.createElement('div'); head.className = 'nm-head';
        head.textContent = 'Trash';
        const x = document.createElement('button'); x.className = 'nm-btn'; x.textContent = '✕'; x.onclick = closeLinksModal;
        head.appendChild(x);
        const body = document.createElement('div'); body.className = 'nm-body';
        function btn(label, fn, danger) { const b = document.createElement('button'); b.className = 'nm-btn' + (danger ? ' danger' : ''); b.textContent = label; b.onclick = fn; return b; }
        function render() {
          body.innerHTML = '';
          if (!trash.length) { body.textContent = 'Trash is empty.'; return; }
          const top = document.createElement('div');
          top.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;opacity:.75;font-size:.78rem;';
          top.textContent = 'Last ' + trash.length + ' deleted links (oldest are dropped after 100)';
          top.appendChild(btn('Empty trash', () => { if (confirm('Permanently delete everything in Trash?')) { trash = []; saveTrash(); refreshTrashLabel(); render(); } }, true));
          body.appendChild(top);
          for (let i = trash.length - 1; i >= 0; i--) {
            const e = trash[i];
            const row = document.createElement('div'); row.className = 'nm-row';
            const info = document.createElement('div'); info.className = 'info';
            const t = document.createElement('div'); t.className = 't'; t.textContent = (e.link && e.link.name) || '(no name)';
            const u = document.createElement('div'); u.className = 'u';
            u.textContent = e.category + ' · ' + ((e.link && e.link.url) || '') + ' · deleted ' + new Date(e.deletedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            info.appendChild(t); info.appendChild(u);
            row.appendChild(info);
            row.appendChild(btn('Restore', () => { restoreFromTrash(i); render(); }));
            row.appendChild(btn('Delete forever', () => { trash.splice(i, 1); saveTrash(); refreshTrashLabel(); render(); }, true));
            body.appendChild(row);
          }
        }
        render();
        box.appendChild(head); box.appendChild(body); ov.appendChild(box);
        ov.addEventListener('mousedown', e => { if (e.target === ov) closeLinksModal(); });
        document.body.appendChild(ov);
        const onKey = e => { if (e.key === 'Escape') { closeLinksModal(); document.removeEventListener('keydown', onKey, true); } };
        document.addEventListener('keydown', onKey, true);
      }

      function loadLinks(filterCategory = null) {
        if (!localStorage.getItem("customCategories")) {
          const defaultCategories = {};
          localStorage.setItem("customCategories", JSON.stringify(defaultCategories));
        }

        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        const linksContainer = document.querySelector(".categories");
        const categorySelect = document.getElementById("category-select");

        linksContainer.innerHTML = "";
        const currentValue = categorySelect.value;
        categorySelect.innerHTML = '<option value="">🔁 Select category</option>';

        for (const category of Object.keys(customCategories)) {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          categorySelect.appendChild(option);
        }

        categorySelect.value = currentValue;

        for (const [category, links] of Object.entries(customCategories)) {
          if (filterCategory && category !== filterCategory) continue;

          const categoryDiv = document.createElement("div");
          categoryDiv.className = "category";
          categoryDiv.dataset.category = category;
          {
            const DARK = ['#4fc1ff', '#4ec9b0', '#dcdcaa', '#ce9178', '#c586c0', '#9cdcfe', '#b5cea8', '#d7ba7d', '#569cd6', '#f48771', '#c3e88d', '#82aaff'];
            const LIGHT = ['#0e7ac4', '#0f9b83', '#9a7b00', '#c4572d', '#a43fa0', '#2872b8', '#3f8f32', '#a86a00', '#2563c9', '#d6452a', '#5a9a1f', '#3b5bdb'];
            // each category keeps its own colour; new ones get the least-used colour so neighbours differ
            let cmap = {};
            try { cmap = JSON.parse(localStorage.getItem('links_catColors') || '{}') || {}; } catch (e) { cmap = {}; }
            if (!(category in cmap)) {
              const used = new Array(DARK.length).fill(0);
              Object.values(cmap).forEach(i => { if (i >= 0 && i < used.length) used[i]++; });
              cmap[category] = used.indexOf(Math.min(...used));
              try { localStorage.setItem('links_catColors', JSON.stringify(cmap)); } catch (e) { }
            }
            const ci = cmap[category];
            categoryDiv.style.setProperty('--cat-d', DARK[ci]);
            categoryDiv.style.setProperty('--cat-l', LIGHT[ci]);
          }

          const h3 = document.createElement("h3");
          const titleSpan = document.createElement("span");
          titleSpan.textContent = category;

          // drag the header to change the order of the categories
          h3.draggable = true;
          h3.title = 'Drag to reorder categories';
          h3.style.cursor = 'grab';
          h3.addEventListener('dragstart', (e) => {
            draggedCat = category;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', category);
            categoryDiv.classList.add('cat-dragging');
            e.stopPropagation();
          });
          h3.addEventListener('dragend', () => {
            draggedCat = null;
            document.querySelectorAll('.cat-dragging, .cat-drag-before, .cat-drag-after').forEach(el => el.classList.remove('cat-dragging', 'cat-drag-before', 'cat-drag-after'));
          });
          categoryDiv.addEventListener('dragover', (e) => {
            if (!draggedCat || draggedCat === category) return;
            e.preventDefault();
            const r = categoryDiv.getBoundingClientRect();
            const before = e.clientX < r.left + r.width / 2;
            categoryDiv.classList.toggle('cat-drag-before', before);
            categoryDiv.classList.toggle('cat-drag-after', !before);
          });
          categoryDiv.addEventListener('dragleave', (e) => {
            if (!categoryDiv.contains(e.relatedTarget)) categoryDiv.classList.remove('cat-drag-before', 'cat-drag-after');
          });
          categoryDiv.addEventListener('drop', (e) => {
            if (!draggedCat) return;
            e.preventDefault();
            e.stopPropagation();
            const r = categoryDiv.getBoundingClientRect();
            reorderCategory(draggedCat, category, e.clientX < r.left + r.width / 2);
          });

          const menuContainer = document.createElement("div");
          menuContainer.className = "menu-container";

          const menuBtn = document.createElement("button");
          menuBtn.className = "li-btn";
          menuBtn.innerHTML = '<i data-lucide="more-vertical" size="14"></i>';
          menuBtn.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.menu-dropdown').forEach(m => {
              if (m !== dropdown) m.classList.remove('show');
            });
            document.querySelectorAll('.category').forEach(c => c.style.zIndex = "1");
            
            const isShowing = dropdown.classList.toggle('show');
            if (isShowing) {
              categoryDiv.style.zIndex = "100";
            }
          };

          const dropdown = document.createElement("div");
          dropdown.className = "menu-dropdown";

          const editBtn = document.createElement("button");
          editBtn.className = "menu-item";
          editBtn.innerHTML = '<i data-lucide="edit-2" size="12"></i> Edit';
          editBtn.onclick = () => {
            const newName = prompt("Edit category name:", category);
            if (newName && newName !== category) {
              const all = JSON.parse(localStorage.getItem("customCategories")) || {};
              if (all[newName]) return alert("Category already exists.");
              all[newName] = all[category];
              delete all[category];
              localStorage.setItem("customCategories", JSON.stringify(all));
              syncLinksToFile();
              loadLinks(document.getElementById("category-select").value || null);
            }
          };

          const delBtn = document.createElement("button");
          delBtn.className = "menu-item delete-item";
          delBtn.innerHTML = '<i data-lucide="trash-2" size="12"></i> Delete';
          delBtn.onclick = () => deleteCategory(category);

          dropdown.appendChild(editBtn);
          dropdown.appendChild(delBtn);
          
          menuContainer.appendChild(menuBtn);
          menuContainer.appendChild(dropdown);

          h3.appendChild(titleSpan);
          h3.appendChild(menuContainer);

          const ul = document.createElement("ul");
          ul.dataset.category = category;
          // Make the UL a drop target for drag and drop
          ul.addEventListener("dragover", handleDragOver);
          ul.addEventListener("drop", (e) => handleDrop(e, category));

          links.forEach((link, index) => {
            const li = document.createElement("li");
            li.draggable = true;
            li.dataset.category = category;
            li.dataset.index = index;

            li.addEventListener("dragstart", (e) => handleDragStart(e, category, index));
            li.addEventListener("dragend", handleDragEnd);
            li.addEventListener("dragover", (e) => handleDragOverItem(e, li));
            li.addEventListener("dragleave", handleDragLeaveItem);

            const a = document.createElement("a");
            a.href = /^\s*javascript:/i.test(link.url || '') ? '#' : link.url;
            a.target = "_blank";
            a.textContent = link.name;
            a.draggable = false; // prevent anchor interfering with dragstart

            const menuContainer = document.createElement("div");
            menuContainer.className = "menu-container";

            const menuBtn = document.createElement("button");
            menuBtn.className = "li-btn";
            menuBtn.innerHTML = '<i data-lucide="more-vertical" size="14"></i>';
            menuBtn.onclick = (e) => {
              e.stopPropagation();
              // Close all other menus and reset their z-indexes
              document.querySelectorAll('.menu-dropdown').forEach(m => {
                if (m !== dropdown) m.classList.remove('show');
              });
              document.querySelectorAll('.category').forEach(c => c.style.zIndex = "1");
              
              const isShowing = dropdown.classList.toggle('show');
              if (isShowing) {
                const catCard = menuBtn.closest('.category');
                if (catCard) catCard.style.zIndex = "100";
              }
            };

            const dropdown = document.createElement("div");
            dropdown.className = "menu-dropdown";
            
            const viewBtn = document.createElement("button");
            viewBtn.className = "menu-item";
            viewBtn.innerHTML = '<i data-lucide="eye" size="12"></i> View';
            viewBtn.onclick = () => {
              if (confirm(`Link URL:\n${link.url}\n\nCopy to clipboard?`)) {
                navigator.clipboard.writeText(link.url).then(() => {
                  showToast("Link copied to clipboard!");
                });
              }
            };

            const editBtn = document.createElement("button");
            editBtn.className = "menu-item";
            editBtn.innerHTML = '<i data-lucide="edit-3" size="12"></i> Edit';
            editBtn.onclick = () => editLink(category, index);

            const delBtn = document.createElement("button");
            delBtn.className = "menu-item delete-item delete-button";
            delBtn.innerHTML = '<i data-lucide="trash-2" size="12"></i> Delete';
            delBtn.onclick = () => deleteLink(category, index);

            const moveBtn = document.createElement("button");
            moveBtn.className = "menu-item";
            moveBtn.innerHTML = '<i data-lucide="folder-input" size="12"></i> Move to…';
            moveBtn.onclick = () => chooseCategoryFor('move', category, index);

            const copyBtn = document.createElement("button");
            copyBtn.className = "menu-item";
            copyBtn.innerHTML = '<i data-lucide="copy" size="12"></i> Copy to…';
            copyBtn.onclick = () => chooseCategoryFor('copy', category, index);

            dropdown.appendChild(viewBtn);
            dropdown.appendChild(editBtn);
            dropdown.appendChild(moveBtn);
            dropdown.appendChild(copyBtn);
            dropdown.appendChild(delBtn);
            
            menuContainer.appendChild(menuBtn);
            menuContainer.appendChild(dropdown);

            li.appendChild(a);
            li.appendChild(menuContainer);
            ul.appendChild(li);
          });

          categoryDiv.appendChild(h3);
          categoryDiv.appendChild(ul);
          linksContainer.appendChild(categoryDiv);
        }

        if (window.lucide) {
          setTimeout(() => lucide.createIcons(), 10);
        }
      }

      // Move category `src` before/after `target`; the order is saved (and synced to the file)
      function reorderCategory(src, target, before) {
        draggedCat = null;
        if (!src || src === target) return;
        const all = JSON.parse(localStorage.getItem("customCategories")) || {};
        if (!(src in all) || !(target in all)) return;
        const keys = Object.keys(all).filter(k => k !== src);
        let i = keys.indexOf(target);
        if (!before) i++;
        keys.splice(i, 0, src);
        const out = {};
        keys.forEach(k => { out[k] = all[k]; });
        localStorage.setItem("customCategories", JSON.stringify(out));
        localStorage.setItem("backup_customCategories", JSON.stringify(out));
        loadLinks(document.getElementById("category-select").value || null);
        syncLinksToFile();
        showToast('✓ Category order saved');
      }

      // ---------- "Select category" dropdown: drag the names to change their order ----------
      (function () {
        const sel = document.getElementById('category-select');
        const menu = document.createElement('div');
        menu.id = 'catOrderMenu';
        menu.hidden = true;
        document.body.appendChild(menu);
        let dragSrc = null;

        const names = () => { try { return Object.keys(JSON.parse(localStorage.getItem('customCategories')) || {}); } catch (e) { return []; } };

        function choose(v) {
          sel.value = v;
          sel.dispatchEvent(new Event('change'));
          close();
        }
        function render() {
          menu.innerHTML = '';
          const hint = document.createElement('div');
          hint.className = 'co-hint';
          hint.textContent = 'Drag ⠿ to change the order · click to select';
          menu.appendChild(hint);

          const none = document.createElement('div');
          none.className = 'co-item' + (sel.value === '' ? ' sel' : '');
          none.textContent = '🔁 Select category (show all)';
          none.onclick = () => choose('');
          menu.appendChild(none);

          names().forEach(n => {
            const it = document.createElement('div');
            it.className = 'co-item' + (sel.value === n ? ' sel' : '');
            it.draggable = true;
            it.dataset.cat = n;
            const h = document.createElement('span'); h.className = 'co-handle'; h.textContent = '⠿';
            const t = document.createElement('span'); t.textContent = n;
            it.appendChild(h); it.appendChild(t);
            it.addEventListener('dragstart', e => { dragSrc = n; it.classList.add('co-drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', n); });
            it.addEventListener('dragend', () => { dragSrc = null; menu.querySelectorAll('.co-drag,.co-before,.co-after').forEach(x => x.classList.remove('co-drag', 'co-before', 'co-after')); });
            it.addEventListener('dragover', e => {
              if (!dragSrc || dragSrc === n) return;
              e.preventDefault();
              const r = it.getBoundingClientRect();
              const before = e.clientY < r.top + r.height / 2;
              it.classList.toggle('co-before', before);
              it.classList.toggle('co-after', !before);
            });
            it.addEventListener('dragleave', () => it.classList.remove('co-before', 'co-after'));
            it.addEventListener('drop', e => {
              if (!dragSrc) return;
              e.preventDefault();
              const r = it.getBoundingClientRect();
              const before = e.clientY < r.top + r.height / 2;
              const src = dragSrc; dragSrc = null;
              reorderCategory(src, n, before);   // saves, syncs, redraws the cards and the select
              render();                           // keep the list open so you can keep dragging
            });
            it.onclick = () => choose(n);
            menu.appendChild(it);
          });
        }
        function open() {
          const r = sel.getBoundingClientRect();
          menu.style.left = r.left + 'px';
          menu.style.top = (r.bottom + 2) + 'px';
          menu.style.minWidth = r.width + 'px';
          render();
          menu.hidden = false;
        }
        function close() { menu.hidden = true; }

        // open our list instead of the browser's plain one
        sel.addEventListener('mousedown', e => { e.preventDefault(); sel.focus(); menu.hidden ? open() : close(); });
        document.addEventListener('mousedown', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== sel) close(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      })();

      // ---------- Move / Copy a link to another (existing or new) category ----------
      function chooseCategoryFor(mode, fromCategory, index) {
        const all = JSON.parse(localStorage.getItem("customCategories")) || {};
        const link = (all[fromCategory] || [])[index];
        if (!link) return;
        const verb = mode === 'move' ? 'Move' : 'Copy';
        closeLinksModal();
        const ov = document.createElement('div');
        ov.id = 'nmOverlay'; ov.className = 'nm-overlay';
        const box = document.createElement('div'); box.className = 'nm-box'; box.style.width = 'min(420px, 92vw)';
        const head = document.createElement('div'); head.className = 'nm-head';
        const title = document.createElement('span');
        title.textContent = verb + ' "' + (link.name || '') + '" to…';
        title.style.cssText = 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px;';
        const x = document.createElement('button'); x.className = 'nm-btn'; x.textContent = '✕'; x.onclick = closeLinksModal;
        head.appendChild(title); head.appendChild(x);
        const body = document.createElement('div'); body.className = 'nm-body';

        const others = Object.keys(all).filter(c => c !== fromCategory);
        if (!others.length) {
          const none = document.createElement('div'); none.style.opacity = '.7'; none.textContent = 'There is no other category yet - type a new name below.';
          body.appendChild(none);
        }
        others.forEach(c => {
          const row = document.createElement('div');
          row.className = 'nm-row'; row.style.cursor = 'pointer';
          const info = document.createElement('div'); info.className = 'info';
          const t = document.createElement('div'); t.className = 't'; t.textContent = c;
          const u = document.createElement('div'); u.className = 'u'; u.textContent = (all[c] || []).length + ' links';
          info.appendChild(t); info.appendChild(u); row.appendChild(info);
          row.onmouseenter = () => { row.style.background = 'rgba(79,70,229,.12)'; };
          row.onmouseleave = () => { row.style.background = ''; };
          row.onclick = () => { closeLinksModal(); applyLinkTransfer(mode, fromCategory, index, c); };
          body.appendChild(row);
        });

        // or create a new category on the spot
        const nw = document.createElement('div');
        nw.style.cssText = 'display:flex;gap:6px;margin-top:10px;';
        const inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = 'Or type a new category name…';
        inp.style.cssText = 'flex:1;';
        const go = document.createElement('button'); go.className = 'nm-btn'; go.textContent = verb + ' here';
        const submit = () => { const n = inp.value.trim(); if (!n) return; closeLinksModal(); applyLinkTransfer(mode, fromCategory, index, n); };
        go.onclick = submit;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        nw.appendChild(inp); nw.appendChild(go); body.appendChild(nw);

        box.appendChild(head); box.appendChild(body); ov.appendChild(box);
        ov.addEventListener('mousedown', e => { if (e.target === ov) closeLinksModal(); });
        document.body.appendChild(ov);
        const onKey = e => { if (e.key === 'Escape') { closeLinksModal(); document.removeEventListener('keydown', onKey, true); } };
        document.addEventListener('keydown', onKey, true);
      }

      function applyLinkTransfer(mode, fromCategory, index, target) {
        const all = JSON.parse(localStorage.getItem("customCategories")) || {};
        const link = (all[fromCategory] || [])[index];
        if (!link || !target || target === fromCategory) return;
        if (!all[target]) all[target] = [];
        const dup = all[target].some(l => l.name === link.name && l.url === link.url);
        if (mode === 'copy') {
          if (dup) { showToast('Already in "' + target + '"'); return; }
          all[target].push({ ...link });
          showToast('✓ Copied to "' + target + '"');
        } else {
          if (!dup) all[target].push(link);       // never create a duplicate in the target
          all[fromCategory].splice(index, 1);
          if (all[fromCategory].length === 0) delete all[fromCategory];
          showToast('✓ Moved to "' + target + '"');
        }
        localStorage.setItem("customCategories", JSON.stringify(all));
        localStorage.setItem("backup_customCategories", JSON.stringify(all));
        loadLinks(document.getElementById("category-select").value || null);
        syncLinksToFile();
      }

      function handleDragStart(e, category, index) {
        dragged.category = category;
        dragged.index = index;
        e.dataTransfer.effectAllowed = "move";
        // Set dummy data to enable dragging in Firefox
        e.dataTransfer.setData("text/plain", "");
        e.currentTarget.classList.add("dragging");
      }

      function handleDragEnd(e) {
        document.querySelectorAll("li.drag-over").forEach(el => el.classList.remove("drag-over"));
        e.currentTarget.classList.remove("dragging");
        dragged = { category: null, index: null };
      }

      function handleDragOver(e) {
        e.preventDefault(); // Necessary to allow drop
        e.dataTransfer.dropEffect = "move";
      }

      function handleDragOverItem(e, li) {
        e.preventDefault();
        if (li.classList.contains("drag-over")) return;
        // Remove previous highlights
        document.querySelectorAll("li.drag-over").forEach(el => el.classList.remove("drag-over"));
        li.classList.add("drag-over");
      }

      function handleDragLeaveItem(e) {
        e.currentTarget.classList.remove("drag-over");
      }

      function handleDrop(e, targetCategory) {
        e.preventDefault();
        document.querySelectorAll("li.drag-over").forEach(el => el.classList.remove("drag-over"));

        if (dragged.category === null || dragged.index === null) return;

        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        const draggedLink = customCategories[dragged.category][dragged.index];

        if (!draggedLink) return;

        // Find insertion index within targetCategory
        const ul = e.currentTarget;
        const children = Array.from(ul.querySelectorAll("li"));

        // Find closest insertion index based on drop position
        let insertIndex = children.length; // default append at end
        // Get mouse Y relative to UL
        const mouseY = e.clientY;

        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          const rect = child.getBoundingClientRect();
          if (mouseY < rect.top + rect.height / 2) {
            insertIndex = i;
            break;
          }
        }

        // Remove dragged link from original category
        customCategories[dragged.category].splice(dragged.index, 1);
        if (customCategories[dragged.category].length === 0) {
          delete customCategories[dragged.category];
        }

        // If dropping in the same category and insert index is after original index, adjust insertIndex
        if (dragged.category === targetCategory && insertIndex > dragged.index) {
          insertIndex--;
        }

        // Create array if targetCategory doesn't exist
        if (!customCategories[targetCategory]) {
          customCategories[targetCategory] = [];
        }

        // Insert dragged link at the new position in targetCategory
        customCategories[targetCategory].splice(insertIndex, 0, draggedLink);

        localStorage.setItem("customCategories", JSON.stringify(customCategories));
        localStorage.setItem("backup_customCategories", JSON.stringify(customCategories));
        syncLinksToFile();
        loadLinks(document.getElementById("category-select").value || null);
      }

      // Existing functions unchanged except loadLinks now attaches drag handlers

      function addNewLink() {
        const selectedCategory = document.getElementById("category-select").value;
        const newCategoryName = document.getElementById("category-name").value.trim();
        const linkName = document.getElementById("link-name").value.trim();
        const linkURL = document.getElementById("link-url").value.trim();

        if (!linkName || !linkURL || (!selectedCategory && !newCategoryName)) {
          alert("Please fill in all fields.");
          return;
        }

        const categoryName = selectedCategory || newCategoryName;
        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        if (!customCategories[categoryName]) customCategories[categoryName] = [];

        customCategories[categoryName].push({ name: linkName, url: linkURL });
        localStorage.setItem("customCategories", JSON.stringify(customCategories));
        localStorage.setItem("backup_customCategories", JSON.stringify(customCategories));

        document.getElementById("category-name").value = "";
        document.getElementById("link-name").value = "";
        document.getElementById("link-url").value = "";
        document.getElementById("category-select").value = "";

        loadLinks();
        syncLinksToFile();
      }
function triggerImport() {
  document.getElementById("importFile").click();
}
      function deleteLink(category, index) {
        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        const linkName = customCategories[category][index].name;
        
        if (!confirm(`Are you sure you want to delete "${linkName}"?`)) return;

        trashLinks(category, [customCategories[category][index]]);
        deletedBackup = {
          category,
          link: customCategories[category][index],
          index,
        };
        customCategories[category].splice(index, 1);
        if (customCategories[category].length === 0) delete customCategories[category];
        localStorage.setItem("customCategories", JSON.stringify(customCategories));
        localStorage.setItem("backup_customCategories", JSON.stringify(customCategories));
        loadLinks();
        syncLinksToFile();
      }

      function deleteCategory(category) {
        if (!confirm(`Are you sure you want to delete the entire category "${category}" and ALL its links?`)) return;
        const all = JSON.parse(localStorage.getItem("customCategories")) || {};
        trashLinks(category, all[category] || []);
        deletedBackup = { category, links: all[category] || [], wholeCategory: true };
        delete all[category];
        localStorage.setItem("customCategories", JSON.stringify(all));
        localStorage.setItem("backup_customCategories", JSON.stringify(all));
        syncLinksToFile();
        loadLinks();
        showToast(`Category "${category}" deleted - click Undo to bring it back`);
      }

      function undoDelete() {
        if (!deletedBackup) return alert("Nothing to undo");
        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        const { category, link, index, links, wholeCategory } = deletedBackup;
        const n = wholeCategory ? (links || []).length : 1;   // they leave the Trash again
        trash.splice(Math.max(0, trash.length - n), n); saveTrash(); refreshTrashLabel();
        if (wholeCategory) {
          customCategories[category] = (customCategories[category] || []).concat(links || []);
          showToast(`Category "${category}" restored`);
        } else {
          if (!customCategories[category]) customCategories[category] = [];
          customCategories[category].splice(index, 0, link);
        }
        deletedBackup = null;
        localStorage.setItem("customCategories", JSON.stringify(customCategories));
        loadLinks();
        syncLinksToFile();
      }

      function editLink(category, index) {
        const customCategories = JSON.parse(localStorage.getItem("customCategories")) || {};
        const link = customCategories[category][index];
        const newName = prompt("Edit Link Name:", link.name);
        const newURL = prompt("Edit Link URL:", link.url);
        const newCategory = prompt("Edit Category:", category);

        if (newName && newURL && newCategory) {
          if (newCategory !== category) {
            if (!customCategories[newCategory]) customCategories[newCategory] = [];
            customCategories[newCategory].push({ name: newName, url: newURL });
            customCategories[category].splice(index, 1);
            if (customCategories[category].length === 0) delete customCategories[category];
          } else {
            customCategories[category][index] = { name: newName, url: newURL };
          }

          localStorage.setItem("customCategories", JSON.stringify(customCategories));
          loadLinks();
          syncLinksToFile();
        }
      }

      function exportToJSON() {
  const data = localStorage.getItem("customCategories");
  if (!data) return alert("No data found to export.");
  const blob = new Blob([data], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "my_links.json";
  link.click();
}


      function importFromJSON() {
        const fileInput = document.getElementById("importFile");
        const file = fileInput.files[0];
        if (!file) return alert("Please choose a file.");
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || typeof data !== 'object' || Array.isArray(data) ||
                !Object.values(data).every(v => Array.isArray(v))) {
              return alert("This file is not a My Links backup.");
            }
            if (!confirm("This will replace all current links. Continue?\n(A backup of your current links is downloaded first.)")) return;
            downloadLinksBackup('before_import');
            localStorage.setItem("customCategories", JSON.stringify(data));
            loadLinks();
            syncLinksToFile();
          } catch (err) {
            alert("Invalid JSON format.");
          }
        };
        reader.readAsText(file);
        fileInput.value = ""; // allow re-importing the same file
      }

      function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        const ball = document.getElementById("themeBall");
        ball.textContent = isDark ? "☀️" : "🌙";
        try { localStorage.setItem('links_dark', isDark ? '1' : '0'); } catch (e) { }
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 10);
      }

      function updateSwitchBall(input) {
        const ball = document.getElementById("deleteBall");
        if (input.checked) {
          ball.style.transform = "translateX(18px)";
          ball.style.background = "#ef4444";
        } else {
          ball.style.transform = "translateX(0)";
          ball.style.background = "white";
        }
      }

      // Wrap loadLinks to ensure icons refresh
      const originalLoadLinks = loadLinks;
      loadLinks = function(filterCategory = null) {
        originalLoadLinks(filterCategory);
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 10);
      };

      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          syncLinksToFile();   // saves to the sync file (and says so)
        }
      });
    </script>
  </body>
