<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Favorite Links</title>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-light: #f8fafc;
        --card-light: rgba(255, 255, 255, 0.8);
        --text-light: #1e293b;
        --border-light: rgba(226, 232, 240, 0.8);
        
        --bg-dark: #0f172a;
        --card-dark: rgba(30, 41, 59, 0.7);
        --text-dark: #f1f5f9;
        --border-dark: rgba(51, 65, 85, 0.5);
        
        --accent-save: #10b981;
        --accent-export: #3b82f6;
        --accent-import: #8b5cf6;
        --accent-nav: #6366f1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', sans-serif;
        background: var(--bg-light);
        color: var(--text-light);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 100vh;
        background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-attachment: fixed;
      }

      body.dark-mode {
        background: var(--bg-dark);
        color: var(--text-dark);
        background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                          radial-gradient(at 50% 0%, hsla(225,39%,10%,1) 0, transparent 50%), 
                          radial-gradient(at 100% 0%, hsla(339,49%,10%,1) 0, transparent 50%);
      }

      /* Header / Form Section */
      .header-container {
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 0.25rem 1rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(255, 255, 255, 0.98);
        border-bottom: 1px solid var(--border-light);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease;
      }

      body.dark-mode .header-container {
        background: rgba(15, 23, 42, 0.98);
        border-bottom: 1px solid var(--border-dark);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.4rem;
        gap: 12px;
        flex-wrap: wrap;
      }

      .logo-section h2 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(to right, #4f46e5, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .header-actions-wrapper {
        display: flex;
        align-items: center;
        gap: 20px;
        flex: 1;
        justify-content: flex-end;
      }

      .nav-links {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .nav-btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border-light);
        background: white;
        color: var(--text-light);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      body.dark-mode .nav-btn {
        background: #1e293b;
        color: #f1f5f9;
        border-color: #334155;
      }

      .nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        border-color: var(--primary);
      }

      /* Form Controls */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        align-items: center;
      }

      input[type="text"], select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(255, 255, 255, 0.9);
        font-family: inherit;
        font-size: 0.8rem;
        transition: all 0.2s ease;
        width: 100%;
      }

      body.dark-mode input[type="text"], body.dark-mode select {
        background: rgba(15, 23, 42, 0.6);
        border-color: #334155;
        color: white;
      }

      input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
      }

      .action-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .action-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .action-item span {
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: #64748b;
      }

      body.dark-mode .action-item span { color: #94a3b8; }

      .btn-icon {
        padding: 6px;
        border-radius: 8px;
        border: 1px solid var(--border-light);
        background: rgba(255, 255, 255, 0.9);
        color: #475569;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }

      body.dark-mode .btn-icon { 
        background: rgba(30, 41, 59, 0.8); 
        border-color: #334155; 
        color: #cbd5e1; 
      }

      .btn-icon:hover { 
        background: var(--primary); 
        color: white;
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      /* Dark Mode Toggle */
      .theme-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--border-light);
        padding: 4px;
        border-radius: 20px;
        cursor: pointer;
        position: relative;
        width: 60px;
        height: 32px;
      }

      body.dark-mode .theme-toggle { background: #334155; }

      .theme-ball {
        width: 24px;
        height: 24px;
        background: white;
        border-radius: 50%;
        position: absolute;
        left: 4px;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      body.dark-mode .theme-ball {
        transform: translateX(28px);
        background: #0f172a;
      }

      /* Categories Grid */
      .categories {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 6px;
        width: 100%;
        max-width: 100%;
        margin: 0;
      }

      .category {
        background: var(--card-light);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0,0,0,0.02);
        min-width: 0;
        position: relative; /* Base for z-index */
      }

      body.dark-mode .category {
        background: var(--card-dark);
        border-color: var(--border-dark);
      }

      .category:hover {
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        border-color: var(--primary);
      }

      .category h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        font-weight: 700;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        color: var(--primary);
        min-height: 28px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--primary);
        letter-spacing: 0.5px;
      }

      .category h3 .menu-container {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      .category ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .category li {
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        border-radius: 4px;
        transition: all 0.2s;
        background: transparent;
        border-bottom: 1px solid rgba(0,0,0,0.03);
      }

      body.dark-mode .category li { border-bottom-color: rgba(255,255,255,0.03); }

      .category li:hover { 
        background: rgba(79, 70, 229, 0.05); 
        padding-left: 10px;
      }

      .category li a {
        flex: 1;
        text-decoration: none;
        color: inherit;
        font-weight: 500;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .category li .actions {
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .category li:hover .actions { opacity: 1; }

      .li-btn {
        background: transparent;
        border: none;
        padding: 4px;
        cursor: pointer;
        border-radius: 4px;
        color: var(--text-light);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        opacity: 0.6;
      }

      .li-btn:hover { 
        background: rgba(0,0,0,0.05); 
        opacity: 1;
      }
      body.dark-mode .li-btn { color: var(--text-dark); }
      body.dark-mode .li-btn:hover { background: rgba(255,255,255,0.1); }

      /* Toast */
      #toast {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: #10b981;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 10001;
        font-size: 0.85rem;
      }

      #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

      /* Deletion */
      .delete-button {
        transition: all 0.2s ease;
      }

      /* Menu Dropdown */
      .menu-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        flex-shrink: 0;
      }

      .menu-dropdown {
        position: absolute;
        right: 0;
        top: 100%;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        z-index: 9999;
        display: none;
        min-width: 130px;
        padding: 4px 0;
        margin-top: 5px;
      }

      body.dark-mode .menu-dropdown {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(255,255,255,0.1);
      }

      .menu-dropdown.show { 
        display: block; 
        animation: menuFade 0.2s ease;
      }

      @keyframes menuFade {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .menu-item {
        padding: 6px 12px;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-light);
        transition: background 0.2s;
        font-family: inherit;
      }

      body.dark-mode .menu-item { color: var(--text-dark); }

      .menu-item:hover { background: rgba(79, 70, 229, 0.1); }
      .menu-item i { color: var(--primary); }
      .menu-item.delete-item { color: #ef4444; }
      .menu-item.delete-item i { color: #ef4444; }

      /* Switches */
      .switch-container {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #64748b;
      }

      .sync-status {
        font-size: 0.8rem;
        color: #10b981;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .file-status {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-light);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 280px;
      }

      /* Trash dialog */
      .nm-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); z-index: 5000; display: flex; align-items: center; justify-content: center; }
      .nm-box { background: #fff; color: #1e293b; border: 1px solid #e2e8f0; border-radius: 12px; width: min(620px, 92vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
      body.dark-mode .nm-box { background: #1e293b; color: #f1f5f9; border-color: #334155; }
      .nm-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(148,163,184,.35); font-weight: 700; }
      .nm-body { padding: 10px 14px; overflow: auto; font-size: .88rem; }
      .nm-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(148,163,184,.25); }
      .nm-row .info { flex: 1; min-width: 0; }
      .nm-row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nm-row .u { font-size: .74rem; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nm-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(148,163,184,.6); background: transparent; color: inherit; cursor: pointer; font-family: inherit; font-size: .8rem; }
      .nm-btn:hover { border-color: var(--primary); color: var(--primary); }
      .nm-btn.danger { color: #ef4444; }

      body.dark-mode .file-status {
        color: var(--text-dark);
      }

      @media (max-width: 900px) {
        .top-bar { flex-direction: column; align-items: flex-start; }
        .form-grid { grid-template-columns: 1fr 1fr; }
      }

      /* ---------- Compact header (like My Notes) ---------- */
      .header-container { padding: 0.15rem 0.75rem; }
      .top-bar { margin-bottom: 0.2rem; gap: 8px; }
      .logo-section h2 { font-size: 1.02rem; gap: 6px; }
      .logo-section h2 svg { width: 18px; height: 18px; }
      .header-actions-wrapper { gap: 10px; }
      .nav-links { gap: 6px; }
      .nav-btn { padding: 4px 10px; font-size: 0.78rem; border-radius: 6px; gap: 5px; }
      .nav-btn svg { width: 14px; height: 14px; }
      .nav-btn:hover { transform: none; }
      .action-group { gap: 4px; }
      .action-item { position: relative; gap: 0; }
      .action-item span { display: none; }                 /* labels become tooltips */
      .btn-icon { padding: 4px; border-radius: 6px; width: 28px; height: 28px; box-shadow: none; }
      .btn-icon svg { width: 15px; height: 15px; }
      .btn-icon:hover { transform: none; }
      .file-status { font-size: 0.78rem; max-width: 240px; }
      .theme-toggle { width: 42px; height: 22px; padding: 2px; }
      .theme-ball { width: 18px; height: 18px; left: 2px; font-size: 11px; }
      body.dark-mode .theme-ball { transform: translateX(20px); }
      input[type="text"], select { padding: 4px 8px; font-size: 0.78rem; border-radius: 6px; }
      .form-grid { gap: 6px; }
      .btn-primary { padding: 6px 14px; font-size: 0.85rem; border-radius: 8px; gap: 6px; }
      .btn-primary svg { width: 16px; height: 16px; }
      /* trash count badge (the text label is hidden) */
      .action-item[data-count]:not([data-count="0"])::after {
        content: attr(data-count);
        position: absolute; top: -5px; right: -5px;
        min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
        background: #ef4444; color: #fff; font-size: 0.6rem; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }

      /* category drag & drop */
      .category.cat-dragging { opacity: 0.45; }
      .category.cat-drag-before { box-shadow: inset 4px 0 0 var(--primary); }
      .category.cat-drag-after { box-shadow: inset -4px 0 0 var(--primary); }

      /* category list with drag-to-reorder */
      #catOrderMenu { position: fixed; z-index: 2000; max-height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; background: #fff; color: #1e293b; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 4px; }
      #catOrderMenu[hidden] { display: none; }
      body.dark-mode #catOrderMenu { background: #1e293b; color: #f1f5f9; border-color: #334155; }
      #catOrderMenu .co-hint { font-size: .68rem; opacity: .65; padding: 2px 8px 4px; white-space: nowrap; }
      #catOrderMenu::-webkit-scrollbar { display: none; width: 0; height: 0; }
      #catOrderMenu .co-item { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: .8rem; line-height: 1.25; white-space: nowrap; }
      #catOrderMenu .co-item:hover { background: rgba(79,70,229,.14); }
      #catOrderMenu .co-item.sel { background: var(--primary); color: #fff; }
      #catOrderMenu .co-handle { cursor: grab; opacity: .6; }
      #catOrderMenu .co-drag { opacity: .4; }
      #catOrderMenu .co-before { box-shadow: inset 0 3px 0 var(--primary); }
      #catOrderMenu .co-after { box-shadow: inset 0 -3px 0 var(--primary); }

      /* ---------- Tighter link rows: more links visible ---------- */
      .category { padding: 6px 8px; }
      .category h3 { margin: 0 0 4px 0; padding-bottom: 4px; min-height: 22px; font-size: 0.95rem; }
      .category li { padding: 0 4px; }
      .category li a { font-size: 0.82rem; line-height: 1.2; padding: 3px 0; }
      .li-btn { padding: 2px; }
      .li-btn svg { width: 14px; height: 14px; }
      .category h3 .li-btn svg { width: 15px; height: 15px; }

      /* ---------- Dark mode: softer, easier-on-the-eyes accent (instead of the vivid blue) ---------- */
      body.dark-mode .category h3 { color: #c7d2fe; border-bottom-color: rgba(165, 180, 252, 0.28); }
      body.dark-mode .category:hover { border-color: rgba(165, 180, 252, 0.45); box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
      body.dark-mode .category { border-color: rgba(148, 163, 184, 0.16); }
      body.dark-mode .category li:hover { background: rgba(165, 180, 252, 0.08); }
      body.dark-mode .btn-primary { background: #3c4a82; color: #e8ecff; }
      body.dark-mode .btn-primary:hover { background: #4a5a9c; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
      body.dark-mode .nav-btn:hover, body.dark-mode .btn-icon:hover { border-color: rgba(165,180,252,0.6); background: rgba(165,180,252,0.14); color: #e8ecff; transform: none; }
      body.dark-mode input:focus, body.dark-mode select:focus { border-color: #8b9cf4; box-shadow: 0 0 0 3px rgba(139,156,244,0.15); }
      body.dark-mode .logo-section h2 { background: linear-gradient(to right, #a5b4fc, #f0abfc); -webkit-background-clip: text; background-clip: text; }
      body.dark-mode #catOrderMenu .co-item.sel { background: #3c4a82; }
      body.dark-mode #catOrderMenu .co-before { box-shadow: inset 0 3px 0 #a5b4fc; }
      body.dark-mode #catOrderMenu .co-after { box-shadow: inset 0 -3px 0 #a5b4fc; }
      body.dark-mode .category.cat-drag-before { box-shadow: inset 4px 0 0 #a5b4fc; }
      body.dark-mode .category.cat-drag-after { box-shadow: inset -4px 0 0 #a5b4fc; }
      body.dark-mode .nm-btn:hover { border-color: #a5b4fc; color: #c7d2fe; }

      /* ---------- Dark mode in the VS Code "Dark+" palette (neutral charcoal, one calm blue) ---------- */
      body.dark-mode {
        --bg-dark: #1e1e1e; --card-dark: #252526; --text-dark: #cccccc; --border-dark: #3c3c3c;
        background: #1e1e1e;
        background-image: none;
        color: #cccccc;
      }
      body.dark-mode .header-container { background: #252526; border-bottom: 1px solid #3c3c3c; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
      body.dark-mode .category { background: #252526; border-color: #3c3c3c; box-shadow: none; }
      body.dark-mode .category:hover { border-color: #0e639c; box-shadow: none; }
      body.dark-mode .category h3 { color: #d4d4d4; border-bottom: 1px solid #3c3c3c; }
      body.dark-mode .category li { border-bottom-color: #2d2d2d; }
      body.dark-mode .category li:hover { background: #2a2d2e; }
      body.dark-mode .category li a { color: #cccccc; }
      body.dark-mode .category li a:hover { color: #3794ff; }
      body.dark-mode .nav-btn, body.dark-mode .btn-icon { background: #2d2d2d; border-color: #3c3c3c; color: #cccccc; }
      body.dark-mode .nav-btn:hover, body.dark-mode .btn-icon:hover { background: #37373d; border-color: #0e639c; color: #ffffff; }
      body.dark-mode .btn-primary { background: #0e639c; color: #ffffff; }
      body.dark-mode .btn-primary:hover { background: #1177bb; }
      body.dark-mode input[type="text"], body.dark-mode select { background: #3c3c3c; border-color: #3c3c3c; color: #cccccc; }

      /* ---------- Coloured category headings ---------- */

      .category:hover { border-color: var(--cat-l, var(--primary)); }
