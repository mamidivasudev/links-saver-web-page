<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Links &amp; Notes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #cccccc; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #bar { height: 36px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: #252526; border-bottom: 1px solid #3c3c3c; box-sizing: border-box; }
    .tab { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 16px; font-size: 13px; color: #9d9d9d; background: transparent; border: none; border-top: 2px solid transparent; border-radius: 6px 6px 0 0; cursor: pointer; font-family: inherit; }
    .tab:hover { color: #ffffff; background: #2a2d2e; }
    .tab.active { color: #ffffff; background: #1e1e1e; border-top-color: #3794ff; }
    .tab svg { width: 15px; height: 15px; }
    #info { margin-left: auto; align-self: center; font-size: 12px; color: #8c8c8c; padding-right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #frames { position: absolute; top: 36px; bottom: 0; left: 0; right: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1e1e1e; }
    iframe.hidden { visibility: hidden; pointer-events: none; }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0e639c; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .3s; z-index: 10; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="bar">
    <button class="tab" data-i="0" title="My Links (Ctrl+1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      My Links
    </button>
    <button class="tab" data-i="1" title="My Notes (Ctrl+2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
      My Notes
    </button>
    <div id="info"></div>
  </div>
  <div id="frames">
    <iframe id="f0" src="MyLinks.html" allow="clipboard-write; clipboard-read"></iframe>
    <iframe id="f1" src="save-notes.html" allow="clipboard-write; clipboard-read"></iframe>
  </div>
  <div id="toast"></div>
  <script>
    const tabs = [...document.querySelectorAll('.tab')];
    const frames = [document.getElementById('f0'), document.getElementById('f1')];
    let current = 0;
    function show(i) {
      if (i < 0) i = current === 0 ? 1 : 0;                  // "other tab"
      current = i;
      tabs.forEach((t, k) => t.classList.toggle('active', k === i));
      frames.forEach((f, k) => f.classList.toggle('hidden', k !== i));
      try { frames[i].contentWindow.focus(); } catch (e) { }
      try { localStorage.setItem('shell_tab', String(i)); } catch (e) { }
    }
    tabs.forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
    let saved = 0;
    try { saved = +(localStorage.getItem('shell_tab') || 0); } catch (e) { }
    show(saved === 1 ? 1 : 0);

    const nfs = window.nativeFS;
    if (nfs) document.getElementById('info').textContent = '📁 ' + nfs.folderPath;

    let tt;
    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m; t.classList.add('show');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
    }
    if (window.shellAPI) {
      shellAPI.onSwitchTab(show);
      shellAPI.onToast(toast);
    }
  </script>
</body>
</html>
